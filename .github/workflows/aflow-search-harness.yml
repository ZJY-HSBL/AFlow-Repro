name: AFlow search-loop integration test
on:
  push:
    branches: [repro/v0.3.0-search-integration]
    paths:
      - tools/run_aflow_search_harness.py
      - .github/workflows/aflow-search-harness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-optimizer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install pinned official AFlow and data-downloader dependencies
        run: |
          python -m pip install -r requirements-repro.txt
          python -m pip install gdown==5.2.0
      - name: Download original author benchmark data
        run: python tools/fetch_author_data.py
      - name: Start secured code execution image
        run: docker pull python:3.11-slim
      - name: Isolate upstream's pre-existing archived scores from new harness measurements
        run: |
          if [ -f workspace/MBPP/workflows/results.json ]; then
            mv workspace/MBPP/workflows/results.json "$RUNNER_TEMP/aflow_original_scores.json"
          fi
      - name: Execute original AFlow search cycle with deterministic transport and real evaluator
        run: python -m tools.run_aflow_search_harness --limit 3 --timeout 120
      - name: Save original optimizer search-state evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-optimizer-deterministic-closed-loop
          path: |
            experiments/aflow-search-harness/*.json
            experiments/aflow-search-harness/generated_graph.py
            experiments/author_data_manifest.json
          if-no-files-found: ignore
