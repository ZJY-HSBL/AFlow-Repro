name: Real open-model AFlow optimizer proposal probe
on:
  push:
    branches: [repro/v0.3.0-search-integration]
    paths:
      - tools/probe_aflow_model.py
      - .github/workflows/aflow-proposal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install original AFlow Python dependencies
        run: |
          python -m pip install -r requirements-repro.txt
          python -m pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.45.2 huggingface_hub==0.25.2 safetensors==0.4.5
      - name: Invoke actual Qwen checkpoint on original full AFlow optimizer prompt
        env:
          OMP_NUM_THREADS: '2'
          TOKENIZERS_PARALLELISM: 'false'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -m tools.probe_aflow_model --max-new-tokens 320
      - name: Preserve real model's raw proposal and strict schema audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-aflow-graph-proposal-probe
          path: experiments/aflow-real-proposal-probe/
          if-no-files-found: ignore
