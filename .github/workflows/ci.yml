name: Reproduction checks
on:
  push:
    branches: [main, "repro/**"]
  pull_request:
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install pinned upstream and reproduction dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-repro.txt
      - name: Check Python source syntax
        run: python -m compileall -q run.py run_baseline.py benchmarks data scripts workspace tools tests
      - name: Run offline algorithm regression tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI module imports
        run: |
          python run.py --help
          python tools/run_mbpp_baseline.py --help
          python tools/plot_results.py --help
      - name: Report dataset and config readiness without secrets
        run: python tools/preflight.py --dataset MBPP
