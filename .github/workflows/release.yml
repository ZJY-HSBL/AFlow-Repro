name: Publish verified milestones
on:
  workflow_run:
    workflows: ["Reproduction checks"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish release only when its evidence and main CI are verified
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -f docs/RELEASE_v0.2.0.md ]; then
            if ! gh release view v0.2.0 >/dev/null 2>&1; then
              gh release create v0.2.0 --target "$TARGET_SHA" --title "v0.2.0 · Real MBPP evaluation milestone" --notes-file docs/RELEASE_v0.2.0.md
            fi
          elif ! gh release view v0.1.0 >/dev/null 2>&1; then
            gh release create v0.1.0 --target "$TARGET_SHA" --title "v0.1.0 · Verified AFlow source baseline" --notes-file docs/RELEASE_v0.1.0.md
          fi
