name: Author-published search trajectory provenance
on:
  push:
    branches: [experiment/mbpp-real-evaluation]
    paths:
      - tools/fetch_author_results.py
      - .github/workflows/author-results.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install gdown==5.2.0
      - name: Inspect actual archive and generate clearly labeled author-archive curves
        run: python -m tools.fetch_author_results
      - name: Commit author-archive summaries (not reproduction metrics)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/author-published/ experiments/author_results_manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: independently summarize author-published AFlow search records"
          git push origin "HEAD:experiment/mbpp-real-evaluation"
      - name: Archive the provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-published-results-provenance
          path: |
            experiments/author_results_manifest.json
            experiments/author-published/*.json
            experiments/author-published/*.svg
          if-no-files-found: ignore
