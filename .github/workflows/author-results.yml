name: Author-published search trajectory provenance
on:
  push:
    branches: [experiment/mbpp-real-evaluation]
    paths:
      - tools/fetch_author_results.py
      - .github/workflows/author-results.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install gdown==5.2.0
      - name: Download author published results and inspect archive without executing anything
        run: python -m tools.fetch_author_results
      - name: Archive provenance metadata, not result contents
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: author-published-results-provenance
          path: experiments/author_results_manifest.json
          if-no-files-found: ignore
